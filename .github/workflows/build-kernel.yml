name: Build XNU Kernel for natrium

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-kernel:

    runs-on: macos-15

    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Install KDK 13.5
        run: |
          # Download Kernel Debug Kit for macOS 13.5
          curl -fsSL "https://download.developer.apple.com/Developer_Tools/Kernel_Debug_Kit_13.5_build_22G74/Kernel_Debug_Kit_13.5_build_22G74.dmg" \
               -o /tmp/kdk.dmg || true
          # Fallback: try alternate URL
          # If KDK not available, build without it (development build)
          echo "KDK installation attempted"

      - name: Clone XNU dependencies
        run: |
          mkdir -p xnu/deps xnu/src
          cd xnu/deps
          # dtrace
          git clone --depth 1 https://github.com/apple-oss-distributions/dtrace.git
          # AvailabilityVersions
          git clone --depth 1 https://github.com/apple-oss-distributions/AvailabilityVersions.git
          # libplatform
          git clone --depth 1 https://github.com/apple-oss-distributions/libplatform.git
          # libdispatch
          git clone --depth 1 https://github.com/apple-oss-distributions/libdispatch.git
          # libpthread (SWEET builds the kext provider into the kernel; see
          # patch 0019, which #includes "sweet_libpthread/kern/kern_init.c")
          git clone --depth 1 --branch libpthread-514.100.2 https://github.com/apple-oss-distributions/libpthread.git
          # XNU source (iOS 16 generation)
          cd ../src
          git clone --depth 1 --branch xnu-8796.121.2 https://github.com/apple-oss-distributions/xnu.git .
          echo "XNU source: xnu-8796.121.2 cloned"

      - name: Apply patches to XNU
        run: |
          cd xnu/src
          PATCH_COUNT=$(ls ../patches/*.patch | wc -l)
          echo "Applying $PATCH_COUNT patches..."
          FAILED=0
          for patch in $(ls ../patches/*.patch | sort); do
            if patch -p1 --forward --batch < "$patch" 2>&1 | tee /tmp/patch.log; then
              echo "✓ $(basename $patch)"
            else
              if grep -q "Reversed (or previously applied)" /tmp/patch.log; then
                echo "~ $(basename $patch) (already applied)"
              else
                echo "✗ $(basename $patch) FAILED"
                FAILED=$((FAILED + 1))
              fi
            fi
          done
          echo "$FAILED patches failed"
          [ $FAILED -lt 10 ] || exit 1  # Allow some failures
          # Place libpthread where patch 0019 expects it:
          #   SWEET_PTHREAD_ROOT = $(SRCROOT)/bsd/pthread/sweet_libpthread
          # The provider .c files #include "sweet_libpthread/kern/kern_init.c".
          if [ -d ../deps/libpthread ]; then
            mkdir -p bsd/pthread/sweet_libpthread
            cp -a ../deps/libpthread/. bsd/pthread/sweet_libpthread/
            echo "Placed libpthread at bsd/pthread/sweet_libpthread/"
            ls bsd/pthread/sweet_libpthread/kern/kern_init.c
          fi
          # Remove DriverKit .iig.cpp entries from iokit/conf/files:
          # the iig tool (Apple-internal) is not in open-source Xcode, so
          # the .iig.cpp files are never generated and clang fails on them.
          # The .iig source files stay; only the generated-impl references go.
          sed -i '' '/^\.\/DriverKit\/.*\.iig\.cpp/d' iokit/conf/files
          REMAINING=$(grep -c '^./DriverKit/.*\.iig\.cpp' iokit/conf/files || true)
          echo "Removed DriverKit .iig.cpp entries from iokit/conf/files ($REMAINING remaining, expect 0)"
          # Also strip $(GENERATED_IMPL) from COMP_FILES in iokit/DriverKit/Makefile,
          # AND remove the $(GENERATED_IMPL) : $(GENERATED_HEADERS) dependency rule.
          # Removing COMP_FILES alone is not enough: the dependency rule means make
          # still tries to build .iig.cpp files (as targets of that rule) whenever
          # the .h files are rebuilt, and falls back to its built-in .cpp suffix
          # rule, trying to compile "OSObject.iig.cpp -> OSObject.iig" as a binary.
          cat > /tmp/patch_driverkit_mk.py << 'PYMK_EOF'
          import re
          path = 'iokit/DriverKit/Makefile'
          txt = open(path).read()
          # Strip $(GENERATED_IMPL) from the COMP_FILES line
          txt = re.sub(
              r'(COMP_FILES\s*=\s*\$\{GENERATED_HEADERS\})\s*\$\(GENERATED_IMPL\)',
              r'\1', txt)
          # Remove the bare dependency rule: $(GENERATED_IMPL) : $(GENERATED_HEADERS)
          txt = re.sub(
              r'\n\$\(GENERATED_IMPL\)\s*:\s*\$\(GENERATED_HEADERS\)\n',
              '\n', txt)
          open(path, 'w').write(txt)
          print('Patched iokit/DriverKit/Makefile')
          PYMK_EOF
          python3 /tmp/patch_driverkit_mk.py
          grep "^COMP_FILES\|GENERATED_IMPL" iokit/DriverKit/Makefile | head -5
          # Add VPATH near the TOP of the DriverKit Makefile so make can find
          # the .iig source files when the %.h : %.iig static pattern rule runs.
          # VPATH must be set BEFORE the rules that depend on it; appending to
          # the end doesn't work because the rule is already parsed by then.
          # Insert after line 1 (after the export line) but before any rules.
          # Use a temp file to avoid YAML escaping issues with sed's multi-line syntax.
          { head -1 iokit/DriverKit/Makefile; echo 'VPATH += $(SOURCE)'; tail -n +2 iokit/DriverKit/Makefile; } > /tmp/driverkit.mk.tmp
          mv /tmp/driverkit.mk.tmp iokit/DriverKit/Makefile
          echo "Added VPATH to top of iokit/DriverKit/Makefile"
          head -5 iokit/DriverKit/Makefile
          # Provide a stub iig tool: the real iig (Apple-internal) generates
          # .h and .iig.cpp from .iig sources.  For a kernel-only build we only
          # need the headers.  A .iig file is already valid C++ when __IIG is
          # not defined: it has #if !__IIG guards that make the kernel view work,
          # and the __IIG_ATTRIBUTES_DEFINED__ block falls through to empty
          # macro definitions for non-iig compilation.  So a raw copy is a
          # correct kernel-view header.  We also provide an empty .iig.cpp so
          # the (now-removed from files, but still in Makefile rules) compile
          # target finds a file if it ever runs.
          cat > /tmp/iig-stub.sh << 'IIG_EOF'
          #!/bin/bash
          # Minimal iig replacement for kernel-only builds.
          out_h=""; impl=""; defs=""
          while [ $# -gt 0 ]; do
            case "$1" in
              --def) defs="$2"; shift 2 ;;
              --header) out_h="$2"; shift 2 ;;
              --impl) impl="$2"; shift 2 ;;
              --framework-name) shift 2 ;;
              --) shift; break ;;
              *) shift ;;
            esac
          done
          [ -n "$out_h" -a -n "$defs" ] && cp "$defs" "$out_h"
          [ -n "$impl" ] && echo "/* stub iig impl */" > "$impl"
          IIG_EOF
          chmod +x /tmp/iig-stub.sh
          # Pre-generate all DriverKit .h files from .iig by copying (the .iig
          # content is a valid kernel-view header thanks to its !__IIG guards).
          # Also pre-copy the .iig source files into OBJROOT/iokit/DriverKit/
          # so the %.h : %.iig static pattern rule (which runs in OBJROOT) can
          # find its prerequisite without needing VPATH (which doesn't work
          # reliably with static pattern rules in sub-make contexts).
          mkdir -p /tmp/xnu-obj/iokit/DriverKit
          for iig in iokit/DriverKit/*.iig; do
            base=$(basename "$iig" .iig)
            cp "$iig" "iokit/DriverKit/$base.h"
            cp "$iig" "/tmp/xnu-obj/iokit/DriverKit/$base.iig"
          done
          echo "Generated $(ls iokit/DriverKit/OSObject.h iokit/DriverKit/IOService.h 2>/dev/null | wc -l | tr -d ' ') sample DriverKit headers + pre-copied .iig to OBJROOT (expect 2)"
          head -3 iokit/DriverKit/OSObject.h
          # Provide a stub TargetConditionals.h for the sweet_pthread provider.
          # The libpthread kext code #undefs XNU_KERNEL_PRIVATE, which makes
          # osfmk/kern/debug.h try to #include <TargetConditionals.h> (an SDK
          # header not available under -nostdinc).  A minimal stub suffices
          # because neither debug.h nor the libpthread code use its macros.
          mkdir -p bsd/pthread/sweet_libpthread/include
          cat > bsd/pthread/sweet_libpthread/include/TargetConditionals.h << 'TC_EOF'
          #ifndef _TARGETCONDITIONALS_H
          #define _TARGETCONDITIONALS_H
          #define TARGET_OS_MAC          1
          #define TARGET_OS_IPHONE       1
          #define TARGET_OS_EMBEDDED     1
          #define TARGET_OS_BRIDGE        0
          #define TARGET_OS_WATCH         0
          #define TARGET_OS_TV            0
          #define TARGET_OS_SIMULATOR     0
          #endif /* _TARGETCONDITIONALS_H */
          TC_EOF
          echo "Wrote stub TargetConditionals.h for sweet_libpthread"

      - name: Build dtrace stubs
        run: |
          cd xnu/deps/dtrace
          # Build just the ctfconvert/ctfdump tools XNU needs
          make DSTROOT=/tmp/dst OBJROOT=/tmp/obj SYMROOT=/tmp/sym || \
          xcodebuild -target ctfconvert -target ctfdump DSTROOT=/tmp/dst || \
          echo "dtrace build skipped - continuing without it"
        continue-on-error: true

      - name: Build AvailabilityVersions
        run: |
          cd xnu/deps/AvailabilityVersions
          SDKROOT=$(xcrun --show-sdk-path)
          mkdir -p dst
          make install SRCROOT=$(pwd) DSTROOT=$(pwd)/dst
          echo "=== AvailabilityVersions output ==="
          find dst -type f
          sudo ditto dst/usr/local "$SDKROOT/usr/local"
          echo "=== SDK usr/local after install ==="
          ls -la "$SDKROOT/usr/local/lib/" || echo "No lib"
          ls -la "$SDKROOT/usr/local/libexec/" || echo "No libexec"

      - name: Build XNU kernel
        run: |
          cd xnu/src
          export SDKROOT=$(xcrun --show-sdk-path)
          mkdir -p "$SDKROOT/usr/local/libexec"
          cat > /tmp/avail_stub.py << 'AVAIL_EOF'
          import sys
          args = sys.argv[1:]
          if '--ios' in args:
              print('8.0 9.0 10.0 11.0 12.0 13.0 14.0 15.0 16.0')
          elif '--macosx' in args:
              print('10.9 10.10 10.11 10.12 10.13 10.14 10.15 11.0 12.0 13.0')
          AVAIL_EOF
          printf '#!/bin/sh\nexec python3 /tmp/avail_stub.py "$@"\n' > "$SDKROOT/usr/local/libexec/availability.pl"
          chmod +x "$SDKROOT/usr/local/libexec/availability.pl"
          sed -i '' 's/^SUPPORTED_ARM64_MACHINE_CONFIGS = .*/SUPPORTED_ARM64_MACHINE_CONFIGS = SWEET/' makedefs/MakeInc.def
          sed -i '' 's/^\(override DEFAULT_ARM64_MACHINE_CONFIG[[:space:]]*:= \).*/\1SWEET/' makedefs/MakeInc.top
          grep -E "SUPPORTED_ARM64_MACHINE_CONFIGS|DEFAULT_ARM64_MACHINE_CONFIG" makedefs/MakeInc.def makedefs/MakeInc.top
          echo "=== Checking SETUP/config ==="
          ls -la SETUP/config/
          echo "=== Pre-populating all SETUP subdirs to OBJROOT ==="
          for d in SETUP/*/; do
            mkdir -p /tmp/xnu-obj/"$d"
            cp "$d"*.c "$d"*.h "$d"*.y "$d"*.l /tmp/xnu-obj/"$d" 2>/dev/null || true
            echo "Pre-populated $d"
          done
          find /tmp/xnu-obj/SETUP -type f | head -20
          echo "=== Fixing missing/broken headers ==="
          # Fix 1: Remove asm.h from all GEN lists in arm/arm64 Makefiles
          #        asm.h is listed as "generated" but no tool exists in open source to generate it
          #        Remove the declarations entirely so make doesn't look for it as a prerequisite
          for mf in osfmk/mach/arm/Makefile osfmk/mach/arm64/Makefile; do
            sed -i '' '/^EXPORT_MD_GEN_LIST = \\$/d' "$mf"
            sed -i '' '/^INSTALL_MD_GEN_LIST = \\$/d' "$mf"
            sed -i '' '/^INSTALL_SF_MD_LCL_GEN_LIST = \\$/d' "$mf"
            sed -i '' '/^[[:space:]]*asm\.h$/d' "$mf"
          done
          echo "Removed asm.h from GEN lists in arm and arm64 Makefiles"
          # Fix 2: Pre-copy .defs files to OBJROOT/osfmk/mach/ (the CURDIR for MIG sub-make)
          #        Also add explicit rules in the Makefile as a fallback
          mkdir -p /tmp/xnu-obj/osfmk/mach
          cp osfmk/mach/*.defs /tmp/xnu-obj/osfmk/mach/
          ls -la /tmp/xnu-obj/osfmk/mach/*.defs
          echo "Pre-copied .defs files to OBJROOT/osfmk/mach/"
          # Add VPATH pointing to SOURCE in case the CURDIR approach doesn't work
          printf '\nVPATH += $(SOURCE)\n' >> osfmk/mach/Makefile
          # Add explicit rules for ALL .defs files so MIG can find all transitive deps
          for f in osfmk/mach/*.defs; do
            base=$(basename "$f")
            printf '%s: $(SOURCE)%s\n\tcp $< $@\n' "$base" "$base"
          done >> osfmk/mach/Makefile
          echo "Added explicit .defs rules to osfmk/mach/Makefile"
          # Same fix for ALL other osfmk subdirs that contain .defs files
          for dir in osfmk/gssd osfmk/kextd osfmk/lockd osfmk/device osfmk/mach_debug osfmk/UserNotification; do
            if [ -d "$dir" ]; then
              printf '\nVPATH += $(SOURCE)\n' >> "$dir/Makefile"
              for f in "$dir"/*.defs; do
                [ -f "$f" ] || continue
                base=$(basename "$f")
                printf '%s: $(SOURCE)%s\n\tcp $< $@\n' "$base" "$base"
              done >> "$dir/Makefile"
              echo "Added .defs rules to $dir/Makefile"
            fi
          done
          # libkern/libkern version.h.template (same mechanism, different extension)
          printf '\nVPATH += $(SOURCE)\nversion.h.template: $(SOURCE)version.h.template\n\tcp $< $@\n' >> libkern/libkern/Makefile
          echo "Added version.h.template rule to libkern/libkern/Makefile"
          # Fix 3: Remove DriverKit from iokit compilation only (iig tool not in open-source Xcode)
          #   a) iokit/conf/Makefile.template: blank COMP_SUBDIRS so the generated
          #      kernel Makefile does not recurse into DriverKit to run iig
          #   b) KEEP DriverKit in iokit/Makefile EXPINC/INSTINC subdirs so the
          #      generated .h files get exported into EXPORT_HDRS for libkern etc.
          #   c) Provide a stub iig and pass IIG=<stub> on the make line so the
          #      DriverKit Makefile's %.h : %.iig rule doesn't fail on the
          #      Apple-internal tool being missing.
          sed -i '' '/^COMP_SUBDIRS = \\$/,/^[[:space:]]*DriverKit$/d' iokit/conf/Makefile.template
          printf 'COMP_SUBDIRS =\n' >> iokit/conf/Makefile.template
          echo "Blanked COMP_SUBDIRS in iokit/conf/Makefile.template"
          grep -n "COMP_SUBDIRS\|DriverKit" iokit/conf/Makefile.template | head -5
          echo "=== Starting XNU build ==="
          # Xcode 16 clang added -Wpre-c11-compat and -Wcast-function-type-strict
          # (both pulled in by -Weverything) which produce thousands of diagnostics
          # in XNU 8796's BSD audit code and startup-hook macros.  Suppress them so
          # the log stays readable and the diagnostics engine doesn't crash the job.
          # Also limit parallelism to 4 so build output is not interleaved beyond
          # recognition; real error lines are extracted at the end via grep.
          set -o pipefail
          make -e \
            MACHINE_CONFIG=SWEET \
            ARCH_CONFIGS=ARM64 \
            KERNEL_CONFIGS=DEVELOPMENT \
            SUPPORTED_ARM64_MACHINE_CONFIGS=SWEET \
            DSTROOT=/tmp/xnu-dst \
            OBJROOT=/tmp/xnu-obj \
            SYMROOT=/tmp/xnu-sym \
            SRCROOT=$(pwd) \
            BUILD_WERROR=0 \
            SKIP_DRIVERKIT=1 \
            BUILD_DSYMS=0 \
            BUILD_STATIC=0 \
            IIG=/tmp/iig-stub.sh \
            "CWARNFLAGS_STD+=-Wno-pre-c11-compat -Wno-cast-function-type-strict -Wno-error=pre-c11-compat -Wno-error=cast-function-type-strict" \
            -j4 2>&1 | tee /tmp/xnu-build.log
          BUILD_STATUS=${PIPESTATUS[0]}
          echo "=== Build errors summary ==="
          grep -E " error:" /tmp/xnu-build.log | grep -v "note:" | head -80 || true
          exit $BUILD_STATUS

      - name: Copy kernel output
        run: |
          find /tmp/xnu-dst -name "kernel*" -type f | head -20
          mkdir -p xnu/out
          cp /tmp/xnu-dst/System/Library/Kernels/kernel.development xnu/out/kernel.development.natrium || \
          find /tmp/xnu-dst -name "kernel*" -exec cp {} xnu/out/ \;
          ls -lh xnu/out/

      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-natrium
          path: xnu/out/kernel.development.natrium
          retention-days: 30

  build-shim:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cross-compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu make

      - name: Build boot shim
        run: |
          cd shim
          make -j$(nproc)

      - name: Generate Apple Device Tree
        run: |
          mkdir -p dtb
          python3 tools/mkadt.py dtb/natrium.adt --natrium --highmem
          ls -lh dtb/

      - name: Upload shim artifact
        uses: actions/upload-artifact@v4
        with:
          name: shim-natrium
          path: |
            shim/out/shim.bin
            dtb/natrium.adt

  assemble:
    needs: [build-kernel, build-shim]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download kernel
        uses: actions/download-artifact@v4
        with:
          name: kernel-natrium
          path: xnu/out/

      - name: Download shim + ADT
        uses: actions/download-artifact@v4
        with:
          name: shim-natrium

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 android-sdk-libsparse-utils
          pip3 install --break-system-packages pyelftools

      - name: Assemble payload
        run: |
          python3 tools/mkpayload.py \
            xnu/out/kernel.development.natrium \
            dtb/natrium.adt \
            xnu/out/payload.bin \
            --cmdline "debug=0xc serial=3 cpus=4 keepsyms=1 rd=ufsroot0 ufsrw=1 rootrw=1 cs_enforcement_disable=1 amfi_get_out_of_my_way=1 wdt=-1 launchd_unsecure_cache=1 natriumfb_hz=60" \
            --blob GPU-PM4=firmware/gpu/a530_pm4.fw \
            --blob GPU-PFP=firmware/gpu/a530_pfp.fw \
            --blob GPU-ZAP-MDT=firmware/gpu/a530_zap.mdt \
            --blob GPU-ZAP-SEG=firmware/gpu/a530_zap.b02 \
            --blob WLAN-FW=firmware/wifi/qwlan30.bin \
            --blob WLAN-BDF=firmware/wifi/bdwlan30.bin

      - name: Create boot image
        run: |
          ./tools/mkbootimg.sh
          ls -lh natrium-boot.img

      - name: Upload boot image
        uses: actions/upload-artifact@v4
        with:
          name: natrium-boot-img
          path: natrium-boot.img
          retention-days: 7
